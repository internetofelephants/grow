<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f3efe5; --ink: #2e2d33; --soft: #6b6860; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'Caveat', cursive; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 18px 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 18px; }
  h1 { font-size: 40px; margin: 0; font-weight: 600; }
  .sub { font-size: 21px; color: var(--soft); }
  #picker { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 4px; }
  .lbl { font-size: 20px; color: var(--soft); }
  .row-break { flex-basis: 100%; height: 0; }
  #msg { font-size: 19px; color: var(--soft); opacity: 0; transition: opacity .4s; }
  #msg.show { opacity: 1; }
  button {
    font-family: inherit; font-size: 19px; color: var(--ink); background: transparent; cursor: pointer;
    border: 1.5px solid rgba(46,45,51,.5); padding: 0 12px 1px;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }
  button:hover { border-color: var(--ink); }
  button.on {
    border: 2px solid var(--ink);
    background: repeating-linear-gradient(-45deg, rgba(46,45,51,.13) 0 1px, transparent 1px 5px);
  }
  main { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; padding: 4px 18px 12px; font-size: 20px; }
  #play { min-width: 84px; }
  #speeds { display: flex; gap: 6px; }
  #year { font-size: 30px; font-weight: 600; min-width: 130px; }
  input[type=range] { flex: 1; min-width: 160px; -webkit-appearance: none; appearance: none; background: transparent; height: 22px; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(46,45,51,.55); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--paper);
  }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(46,45,51,.55); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
  .note { font-size: 17px; color: var(--soft); }
</style>
</head>
<body>
<header>
  <h1>How trees grow</h1>
  <span class="sub">side by side, from seed · 1 second = 1 year</span>
  <div id="picker"></div>
</header>
<main><canvas id="c"></canvas></main>
<footer>
  <button id="play">▶ play</button>
  <button id="restart">↺ restart</button>
  <span class="lbl">years per second</span>
  <div id="speeds"></div>
  <span id="year">year 0</span>
  <input type="range" id="scrub" min="0" max="100" step="1" value="0" aria-label="Year">
  <span class="note">typical values for open-grown trees, from forestry sources</span>
</footer>
<!-- the dev server lets the browser cache stale code, so bust it on every load -->
<script>document.write('<script src="main.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
